<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Feud — Host</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161028">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161028;
  --plum-2:#2d2049;
  --cream:#fdf6e7;
  --marigold:#ffc247;
  --coral:#ff6f61;
  --mint:#7fd6c1;
  --dim:#9c92b8;
  --display:"Fredoka","Trebuchet MS",Verdana,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--cream);font-family:var(--body);
  min-height:100vh;-webkit-text-size-adjust:100%;
  padding:0 12px calc(28px + env(safe-area-inset-bottom));
}
.wrap{max-width:620px;margin:0 auto}

/* ---------- sticky header ---------- */
.top{
  position:sticky;top:0;z-index:20;background:rgba(22,16,40,.96);backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;margin-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;color:var(--marigold);line-height:1}
.status{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--dim);
  background:#1b1330;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.status.on{color:var(--mint)} .status.on .dot{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.status.wait{color:var(--marigold)} .status.wait .dot{background:var(--marigold);animation:blink 1.4s ease-in-out infinite}
.status.bad{color:var(--coral)} .status.bad .dot{background:var(--coral)}
@keyframes blink{50%{opacity:.25}}

/* ---------- sections ---------- */
.hsec{background:var(--plum-2);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px;margin-bottom:12px}
.hsec h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--marigold);margin:0 0 10px;font-weight:800}
.hq{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.3;margin:0}

/* ---------- buttons ---------- */
button{font-family:var(--body);font-weight:600;font-size:15px;border-radius:11px;
  border:1px solid rgba(255,255,255,.16);background:#3a2a5e;color:var(--cream);
  padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button.primary{background:var(--marigold);color:#3a2a06;border-color:#f0a92c}
button.danger{background:var(--coral);color:#fff;border-color:#ff9d93}
/* The two one-tap actions — start, and calling a wrong guess — get a
   thumb-sized target. */
button.big{width:100%;font-family:var(--display);font-weight:700;font-size:18px;padding:19px 14px}
.namestack{display:flex;flex-direction:column;gap:8px}
button:disabled{opacity:.4}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- answer rows ---------- */
.alist{display:flex;flex-direction:column;gap:7px}
.arow{display:flex;align-items:center;gap:11px;background:#1b1330;border:1px solid rgba(255,255,255,.09);
  border-radius:11px;padding:14px 12px;text-align:left;width:100%;font-size:16px}
.arow.rev{background:#14382f;border-color:var(--mint)}
/* Already paid out: still on the board, but no longer part of the pot. */
.arow.paid{background:#191430;border-color:rgba(255,255,255,.09);opacity:.55}
.arow .n{font-family:var(--display);font-weight:700;color:var(--dim);width:15px;flex:none}
.arow .t{flex:1;font-weight:600}
.arow.rev .t{text-decoration:line-through;opacity:.6}
.arow .p{font-family:var(--display);font-weight:700;color:var(--marigold);font-size:18px}
.arow.paid .p{color:var(--dim)}
.arow .tick{font-size:14px;color:var(--mint);width:15px;text-align:center;flex:none}
.arow.paid .tick{color:var(--dim);font-weight:700}

/* ---------- inputs ---------- */
input[type=text],input[type=number]{font-family:var(--body);font-size:16px;padding:12px;border-radius:11px;
  border:1px solid rgba(255,255,255,.18);background:#1b1330;color:var(--cream);width:100%}
input:focus-visible{outline:3px solid var(--mint);outline-offset:1px}
.guessrow{display:flex;gap:8px}
.guessrow input{flex:1}
.guessrow button{flex:none}
.flash{font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
.flash.ok{color:var(--mint)} .flash.no{color:var(--coral)}
.tiny{font-size:12px;color:var(--dim);line-height:1.5}

/* ---------- pairing ---------- */
#pairbox input{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);
  font-size:26px;font-weight:700;text-align:center}
#pairbox.done{display:none}
.warn{background:rgba(255,194,71,.12);border:1px solid rgba(255,194,71,.45);color:#ffe7b8;
  border-radius:12px;padding:11px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.qjump{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:5px;-webkit-overflow-scrolling:touch}
.qjump button{text-align:left;font-size:14px;padding:11px 10px;font-weight:500}
.qjump button.cur{background:var(--marigold);color:#3a2a06}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="toprow">
      <div class="brand">Host panel</div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Not connected</span></div>
    </div>
  </div>

  <div class="hsec" id="pairbox">
    <h3>Connect to the big screen</h3>
    <div class="guessrow">
      <input type="text" id="code" maxlength="4" placeholder="CODE" autocomplete="off"
             autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text"
             aria-label="Room code from the big screen">
      <button class="primary" data-act="pair">Connect</button>
    </div>
    <p class="tiny" style="margin:9px 0 0">Type the 4-character code showing on the game screen. Everything below works even without a connection — it is your answer key either way.</p>
    <p class="tiny" id="pairnote" style="margin:8px 0 0;color:var(--marigold)"></p>
  </div>

  <div id="panel"></div>
</div>

<script src="../questions.js"></script>
<script src="../peerjs.min.js"></script>
<script src="../sync.js"></script>
<script>
(function(){
"use strict";
var QUESTIONS = window.BABY_FEUD_QUESTIONS;
var DEMO = window.BABY_FEUD_DEMO;
var BF = window.BabyFeudSync;
var Sync = BF.Sync;

/* The phone owns the game. It survives a reload from localStorage and seeds
   the board whenever the board connects, so refreshing either device
   mid-party never loses the scores. */
var S = BF.loadState();

/* Pointed at the example round while explaining, so reveal / reveal-all /
   hide-all all work there without a second copy of each action. */
function curQ(){ return S.phase==="demo" ? DEMO : QUESTIONS[S.qi]; }
function curRev(){ return S.phase==="demo" ? S.demoRevealed : S.revealed[S.qi]; }
/* Only what the team in control has turned up since the last award. Already
   paid-out answers stay on the board but no longer count. */
var ROUND_VALUE = QUESTIONS[0].a.reduce(function(sum,ans){ return sum + ans[1]; }, 0);
function curBank(){ return S.banked[S.qi]; }
function pot(){
  if(S.phase==="demo") return 0;   // the example round is not scored
  var rev = curRev(), bank = curBank();
  return curQ().a.reduce(function(sum,ans,i){
    return sum + (rev[i] && !bank[i] ? ans[1] : 0);
  }, 0) * S.mult;
}
function roundDone(){ return curRev().every(function(v){ return v; }) && pot() === 0; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* Push to the screen and persist on every change — there is no explicit save. */
function commit(){
  BF.saveState(S);
  Sync.send(S);
  render();
}

/* ===================== GUESS MATCHING ===================== */
function norm(s){ return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function matchGuess(g){
  var n = norm(g); if(!n) return -1;
  var words = n.split(" ").filter(function(w){ return w.length>2; });
  var best=-1, bestScore=0;
  curQ().a.forEach(function(ans,i){
    var t = norm(ans[0]);
    var score = 0;
    if(t===n) score=100;
    else if(t.indexOf(n)>=0 || n.indexOf(t)>=0) score=70;
    else {
      var tw = t.split(" ");
      var hits = words.filter(function(w){
        return tw.some(function(x){ return x.indexOf(w.slice(0,4))===0 || w.indexOf(x.slice(0,4))===0; });
      }).length;
      if(hits) score = 30 + hits*10;
    }
    if(score>bestScore){ bestScore=score; best=i; }
  });
  return bestScore>=30 ? best : -1;
}

/* ===================== RENDER ===================== */
/* Title screen: name the teams as they tell you, then start. */
function homeHTML(){
  return ''+
  '<div class="hsec">'+
    '<h3>Team names</h3>'+
    '<div class="namestack">'+
      '<input type="text" data-act="nameA" value="'+esc(S.names.A)+'" maxlength="24" aria-label="Team 1 name">'+
      '<input type="text" data-act="nameB" value="'+esc(S.names.B)+'" maxlength="24" aria-label="Team 2 name">'+
    '</div>'+
    '<p class="tiny" style="margin:10px 0 0">These show on the big screen as you type.</p>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Explain the game first?</h3>'+
    '<button data-act="demo" style="width:100%">Show the example round</button>'+
    '<p class="tiny" style="margin:9px 0 0">Puts a practice question on the big screen so you can walk everyone through it. Nothing is scored.</p>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Ready?</h3>'+
    '<button class="primary big" data-act="start">Start game</button>'+
    '<p class="tiny" style="margin:10px 0 0">'+QUESTIONS.length+' rounds, '+ROUND_VALUE+' points a round. The answers appear here once you start.</p>'+
  '</div>';
}

/* The example round: the same answer rows and the same ✕, so the walkthrough
   matches what happens for real. No pot, no scores, no round navigation. */
function demoHTML(){
  var rev = S.demoRevealed;
  return ''+
  '<div class="hsec">'+
    '<h3>Example round</h3>'+
    '<p class="hq">'+esc(DEMO.q)+'</p>'+
    '<p class="tiny" style="margin:8px 0 0">Tap an answer to flip it on the big screen, exactly as in a real round. Nothing here is scored.</p>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Answers — tap to reveal</h3>'+
    '<div class="alist">'+
      DEMO.a.map(function(a,i){
        return '<button class="arow '+(rev[i]?"rev":"")+'" data-act="reveal" data-i="'+i+'">'+
          '<span class="n">'+(i+1)+'</span>'+
          '<span class="t">'+esc(a[0])+'</span>'+
          '<span class="p">'+a[1]+'</span>'+
          '<span class="tick">'+(rev[i]?"✓":"")+'</span></button>';
      }).join("")+
    '</div>'+
    '<div class="hgrid" style="margin-top:10px">'+
      '<button data-act="revealAll">Reveal all</button>'+
      '<button data-act="resetRound">Hide all</button>'+
    '</div>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Wrong answer</h3>'+
    '<button class="danger big" data-act="buzz">WRONG GUESS</button>'+
    '<p class="tiny" style="margin:9px 0 0">Worth showing them once so the ✕ is not a surprise.</p>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Done explaining?</h3>'+
    '<button class="primary big" data-act="start">Start the real game</button>'+
    '<p class="tiny" style="margin:9px 0 12px">Scores start at zero.</p>'+
    '<button data-act="home" style="width:100%">Back to the title screen</button>'+
  '</div>';
}

function panelHTML(){
  if(S.phase === "home") return homeHTML();
  if(S.phase === "demo") return demoHTML();
  var q=curQ(), rev=curRev(), bank=curBank(), p=pot(), done=roundDone();
  return ''+
  '<div class="hsec">'+
    '<h3>Round '+(S.qi+1)+' of '+QUESTIONS.length+'</h3>'+
    '<p class="hq">'+esc(q.q)+'</p>'+
    '<div class="hgrid" style="margin-top:11px">'+
      '<button data-act="prev"'+(S.qi===0?" disabled":"")+'>← Previous</button>'+
      '<button data-act="next"'+(S.qi===QUESTIONS.length-1?" disabled":"")+'>Next →</button>'+
    '</div>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Answers — tap to reveal</h3>'+
    '<div class="alist">'+
      q.a.map(function(a,i){
        var paid = rev[i] && bank[i];
        return '<button class="arow '+(rev[i]?"rev":"")+(paid?" paid":"")+'" data-act="reveal" data-i="'+i+'">'+
          '<span class="n">'+(i+1)+'</span>'+
          '<span class="t">'+esc(a[0])+'</span>'+
          '<span class="p">'+a[1]+'</span>'+
          '<span class="tick">'+(paid?"$":rev[i]?"✓":"")+'</span></button>';
      }).join("")+
    '</div>'+
    '<div class="hgrid" style="margin-top:10px">'+
      '<button data-act="revealAll">Reveal all</button>'+
      '<button data-act="resetRound">Hide all</button>'+
    '</div>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Wrong answer</h3>'+
    '<button class="danger big" data-act="buzz">WRONG GUESS</button>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Type what they guessed</h3>'+
    '<div class="guessrow">'+
      '<input type="text" id="guess" placeholder="e.g. sleeping" autocomplete="off" autocorrect="off">'+
      '<button class="primary" data-act="check">Check</button>'+
    '</div>'+
    '<div class="flash" id="flash"></div>'+
    '<p class="tiny">A match reveals that answer. No match just says so — calling it wrong is your call.</p>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Pot — '+p+' points</h3>'+
    (done
      ? '<p class="tiny" style="margin:0 0 10px;color:var(--mint)"><strong>Round complete.</strong> Every answer is up and paid out — move to the next round.</p>'
      : p===0
        ? '<p class="tiny" style="margin:0 0 10px">Nothing new on the board, so this just hands the turn over.</p>'
        : '<p class="tiny" style="margin:0 0 10px">Banks '+p+' and passes control to the other team.</p>')+
    '<div class="hgrid">'+
      '<button class="primary" data-act="awardA"'+(done?" disabled":"")+'>Award to '+esc(S.names.A)+'</button>'+
      '<button class="primary" data-act="awardB"'+(done?" disabled":"")+'>Award to '+esc(S.names.B)+'</button>'+
    '</div>'+
    '<div class="hgrid3" style="margin-top:8px">'+
      [1,2,3].map(function(m){
        return '<button data-act="mult" data-m="'+m+'"'+(S.mult===m?' class="primary"':'')+'>×'+m+'</button>';
      }).join("")+
    '</div>'+
    '<p class="tiny" style="margin-top:9px">Double and triple rounds multiply every answer’s value.</p>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Teams</h3>'+
    '<div class="hgrid">'+
      '<input type="text" data-act="nameA" value="'+esc(S.names.A)+'" aria-label="Team 1 name">'+
      '<input type="text" data-act="nameB" value="'+esc(S.names.B)+'" aria-label="Team 2 name">'+
    '</div>'+
    '<div class="hgrid" style="margin-top:8px">'+
      '<button data-act="ctrlA"'+(S.control==="A"?' class="primary"':'')+'>'+esc(S.names.A)+' has control</button>'+
      '<button data-act="ctrlB"'+(S.control==="B"?' class="primary"':'')+'>'+esc(S.names.B)+' has control</button>'+
    '</div>'+
    '<div class="hgrid" style="margin-top:8px">'+
      '<input type="number" data-act="scoreA" value="'+S.scores.A+'" aria-label="Team 1 score">'+
      '<input type="number" data-act="scoreB" value="'+S.scores.B+'" aria-label="Team 2 score">'+
    '</div>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Jump to a round</h3>'+
    '<div class="qjump">'+
      QUESTIONS.map(function(qq,i){
        return '<button data-act="goto" data-i="'+i+'"'+(i===S.qi?' class="cur"':'')+'>'+
          (i+1)+'. '+esc(qq.q.slice(0,44))+(qq.q.length>44?"…":"")+'</button>';
      }).join("")+
    '</div>'+
  '</div>'+

  '<div class="hsec">'+
    '<h3>Game</h3>'+
    '<button data-act="home" style="width:100%">Back to the title screen</button>'+
    '<p class="tiny" style="margin:9px 0 12px">Scores and revealed answers are kept.</p>'+
    '<button class="danger" data-act="resetGame" style="width:100%">Reset the whole game</button>'+
  '</div>';
}

/* Rebuilding the panel wholesale would drop the keyboard mid-word, so the
   focused field and its caret are put back afterwards. */
function render(){
  var panel = document.getElementById("panel");
  var active = document.activeElement;
  var key = active && active.dataset ? (active.dataset.act || active.id) : null;
  var start = null, end = null;
  if(active && (active.tagName==="INPUT")){
    try{ start = active.selectionStart; end = active.selectionEnd; }catch(e){}
  }
  var flash = document.getElementById("flash");
  var flashText = flash ? flash.textContent : "";
  var flashClass = flash ? flash.className : "flash";
  var guess = document.getElementById("guess");
  var guessVal = guess ? guess.value : "";

  panel.innerHTML = panelHTML();

  var g2 = document.getElementById("guess");
  if(g2) g2.value = guessVal;
  var f2 = document.getElementById("flash");
  if(f2){ f2.textContent = flashText; f2.className = flashClass; }

  if(key){
    var back = panel.querySelector('[data-act="'+key+'"]') || document.getElementById(key);
    if(back && back.tagName === "INPUT" && document.activeElement !== back){
      back.focus();
      if(start !== null){ try{ back.setSelectionRange(start,end); }catch(e){} }
    }
  }
}

function flashMsg(msg, cls){
  var f = document.getElementById("flash");
  if(f){ f.textContent = msg; f.className = "flash " + cls; }
}

/* ===================== ACTIONS ===================== */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el || el.tagName === "INPUT") return;
  var act = el.dataset.act;

  if(act==="pair"){
    Sync.connect(document.getElementById("code").value);
    return;
  }
  if(act==="reveal"){
    var i = +el.dataset.i;
    curRev()[i] = !curRev()[i];
  }
  else if(act==="revealAll"){ curRev().forEach(function(_,i){ curRev()[i] = true; }); }
  else if(act==="resetRound"){
    if(S.phase==="demo"){
      S.demoRevealed = DEMO.a.map(function(){ return false; });
    } else {
      S.revealed[S.qi] = curQ().a.map(function(){ return false; });
      S.banked[S.qi] = curQ().a.map(function(){ return false; });
    }
  }
  else if(act==="buzz"){ S.buzz++; }
  else if(act==="start"){ S.phase = "playing"; }
  else if(act==="home"){ S.phase = "home"; }
  else if(act==="demo"){
    S.phase = "demo";
    S.demoRevealed = DEMO.a.map(function(){ return false; });   // always start clean
  }
  else if(act==="awardA" || act==="awardB"){
    if(roundDone()) return;                      // every answer is up and paid for
    var team = act==="awardA" ? "A" : "B";
    /* Zero when the team in control turned nothing up — the tap then simply
       hands the turn over. */
    S.scores[team] += pot();
    curRev().forEach(function(up,i){ if(up) curBank()[i] = true; });
    S.control = team === "A" ? "B" : "A";        // the other team plays on
  }
  else if(act==="prev"){ S.qi = Math.max(0,S.qi-1); }
  else if(act==="next"){ S.qi = Math.min(QUESTIONS.length-1,S.qi+1); }
  else if(act==="goto"){ S.qi = +el.dataset.i; }
  else if(act==="mult"){ S.mult = +el.dataset.m; }
  else if(act==="ctrlA"){ S.control = S.control==="A" ? null : "A"; }
  else if(act==="ctrlB"){ S.control = S.control==="B" ? null : "B"; }
  else if(act==="resetGame"){
    if(!confirm("Reset scores and every revealed answer?")) return;
    S = BF.newState();
  }
  else if(act==="check"){
    var inp = document.getElementById("guess");
    var idx = matchGuess(inp ? inp.value : "");
    if(idx>=0 && curRev()[idx]){
      flashMsg("“"+curQ().a[idx][0]+"” is already on the board.","no");
    } else if(idx>=0){
      curRev()[idx] = true;
      commit();
      flashMsg("Match — “"+curQ().a[idx][0]+"” for "+curQ().a[idx][1]*S.mult+".","ok");
    } else {
      /* Deliberately does NOT flash the ✕. The matcher compares words, guests
         answer by meaning, so a right answer can easily fail to match — and
         throwing a giant cross at someone who was correct is the one thing
         that would actually sour the game. You judge; the button is there. */
      flashMsg("No match — tap the answer if they got it, or WRONG GUESS if not.","no");
    }
    var inp2 = document.getElementById("guess");
    if(inp2){ inp2.value = ""; inp2.focus(); }
    return;
  }
  else return;

  commit();
});

document.addEventListener("input", function(e){
  var el = e.target;
  if(!el.dataset || !el.dataset.act) return;
  var act = el.dataset.act;
  if(act==="nameA"){ S.names.A = el.value || "Team 1"; }
  else if(act==="nameB"){ S.names.B = el.value || "Team 2"; }
  else if(act==="scoreA"){ S.scores.A = +el.value || 0; }
  else if(act==="scoreB"){ S.scores.B = +el.value || 0; }
  else return;
  /* Skip the local re-render so the field keeps focus; the screen still updates. */
  BF.saveState(S);
  Sync.send(S);
});

document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  if(e.target.id === "guess"){
    e.preventDefault();
    var btn = document.querySelector('[data-act="check"]');
    if(btn) btn.click();
  } else if(e.target.id === "code"){
    e.preventDefault();
    Sync.connect(e.target.value);
  }
});

/* ===================== CONNECTION ===================== */
function setStatus(status, detail, code){
  var box = document.getElementById("status");
  var txt = document.getElementById("statusText");
  var pairbox = document.getElementById("pairbox");
  var note = document.getElementById("pairnote");
  if(note) note.textContent = (status === "connected") ? "" : (detail || "");
  box.className = "status";
  if(status === "connected"){
    box.classList.add("on");
    txt.textContent = "Screen · " + code;
    pairbox.classList.add("done");
  } else if(status === "connecting"){
    box.classList.add("wait");
    txt.textContent = "Connecting…";
    pairbox.classList.remove("done");
  } else if(status === "error"){
    box.classList.add("bad");
    txt.textContent = detail || "Not connected";
    pairbox.classList.remove("done");
  } else {
    txt.textContent = "Not connected";
    pairbox.classList.remove("done");
  }
}

Sync.seedWith(function(){ return S; });
Sync.init({
  role:"host",
  onState:function(next){ S = next; BF.saveState(S); render(); },
  onStatus:setStatus
});

render();

/* Reuse the last code, or one handed over in the URL as /host/#ABCD, and dial
   it straight away — reloading the phone mid-game should not need a re-tap. */
var hashCode = (location.hash || "").replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,4);
var prefill = hashCode || BF.loadCode("host");
if(prefill.length === 4){
  document.getElementById("code").value = prefill;
  Sync.connect(prefill);
}
})();
</script>
